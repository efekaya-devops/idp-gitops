# the tenant SecretStore and the apps' ExternalSecrets are external-secrets.io/v1.
# waves 5-7 come after the core (crossplane, claims, services) on purpose: a
# problem here must not block provisioning.
# the SecretStore will not authenticate on kind (Azure/AWS/STACKIT/Vault); the
# resources still sync, they just report not ready. that is expected on the demo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.7.0
    helm:
      # three small pods (controller, webhook, cert-controller), ~100 MB in
      # total - sized for the 8 GB lean box
      valuesObject:
        resources:
          requests: { cpu: 10m, memory: 32Mi }
          limits: { memory: 128Mi }
        webhook:
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
        certController:
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # the CRDs are too big for client-side apply's annotation
      - ServerSideApply=true
